[notification]
background_opacity = 0.90000000000000002
history_retention_hours = 24
layer = "overlay"

[osd]
background_opacity = 0.89999997988343239
position = "bottom_center"

[shell]
font_family = "Noto Sans"
lang = "en"
polkit_agent = true

    [shell.launcher]
    categories = false

        [shell.launcher.providers.emoji]
        prefix = "e"

        [shell.launcher.providers.session]
        global = true

        [shell.launcher.providers.windows]
        prefix = "w"

    [shell.panel]
    control_center_placement = "floating"
    transparency_mode = "glass"

    [shell.screenshot]
    confirm_region = true
    remember_last_region = true
    save_to_file = false

    [shell.window_switcher]
    mru = true

[system.monitor]
enabled = false

[theme]
community_palette = "Oxocarbon"
custom_palette = "stylix"
mode = "dark"
source = "custom"

[wallpaper.default]
path = "/nix/store/bpjhvvyp8lxywg020sm7fikk4zzdllv8-background.png"

[widget.clock.actions]
left = "panel-toggle control-center"

[widget.control-center]
enabled = false

[widget.network]
show_label = false
vpn_status = "hidden"
