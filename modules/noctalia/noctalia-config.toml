[bar.default]
auto_hide = true
background_opacity = 0.89999997988343239
border_width = 1.0
capsule = true
end = [ "media", "tray", "group:g1", "volume", "battery", "session" ]
layer = "overlay"
margin_edge = 15
margin_ends = 250
reserve_space = false
show_on_workspace_switch = false
start = []

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "bluetooth", "network" ]
    opacity = 1.0
    padding = 6.0

[battery.device."/org/freedesktop/UPower/devices/headphones_dev_E4_58_BC_C4_83_F4"]
warning_threshold = 10

[control_center]
hidden_tabs = [ "weather", "calendar" ]

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "clipboard"

    [[control_center.shortcuts]]
    type = "media"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.90000000000000002

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    locked_timeout = 600.0
    timeout = 1200.0

[location]
address = "Lund, Sweden"

[lockscreen]
blurred_desktop = true

